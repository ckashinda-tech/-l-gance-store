<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Élégance Store</title>
</head>

<body>
  <h1>Élégance Store</h1>
  <h2>Espace administrateur</h2>

  <p>Bienvenue dans ton espace de gestion.</p>

  <h3>Ajouter un produit</h3>

  <form>
    <label>Nom du produit :</label><br>
    <input type="text" placeholder="Ex : Robe élégante"><br><br>

    <label>Prix :</label><br>
    <input type="number" placeholder="Prix en FC"><br><br>

    <label>Photo du produit :</label><br>
    <input type="file" accept="image/*"><br><br>

    <button type="button">Ajouter le produit</button>
  </form>
</body>
</html>
